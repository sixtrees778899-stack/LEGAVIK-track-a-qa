<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CJAS AR Mainnet Experience Harness V1.1</title><link rel="stylesheet" href="./style.css"></head><body><main>
<h1>CJAS AR Mainnet Experience Harness V1.1</h1><p class="warning">独立 PDF Pilot · Arweave Mainnet · 单次及累计费用均不得超过 0.01 AR</p>
<section class="card"><h2>1. 浏览器本地生成测试材料</h2><label>无敏感信息的测试 PDF<input id="original" type="file" accept=".pdf,application/pdf"></label><label>本次测试恢复密码<input id="create-password" type="password" autocomplete="off"></label><label><input id="safe-confirm" type="checkbox"> 我确认该 PDF 不包含真实秘密、密码、私钥、助记词、恢复材料或账户资料。</label><button id="generate">浏览器本地加密并生成 Archive</button><div id="generation-result"></div><button id="save-kit" disabled>保存 Recovery Kit</button><button id="save-archive" disabled>保存本地 Archive 副本（可选，不是主网独立恢复必需文件）</button><div id="credential-reminder"></div></section>
<section class="card"><h2>2. 钱包与实时报价</h2><button id="quote" disabled>连接钱包并获取实时报价</button><div id="quote-result"></div><button id="upload" disabled>CEO 确认签名并上传</button></section>
<section class="card"><h2>3. 新会话独立恢复</h2><label>Mainnet Evidence JSON<input id="evidence-file" type="file" accept=".json,application/json"></label><button id="import-evidence">导入证据</button><label>原始测试 PDF（可选，仅用于本次测试的一致性校验，不参与恢复）<input id="recovery-original" type="file" accept=".pdf,application/pdf"></label><label>Recovery Kit<input id="kit" type="file" accept=".cjas,application/octet-stream"></label><label>恢复密码<input id="password" type="password" autocomplete="off"></label><button id="recover">按 TxID 从 Mainnet 下载并恢复</button><ol id="recovery-stages"></ol><section id="recovery-success" class="success-card" hidden><h2>恢复成功</h2><dl><div><dt>文件名</dt><dd id="success-name"></dd></div><div><dt>文件类型</dt><dd>PDF</dd></div><div><dt>文件大小</dt><dd id="success-size"></dd></div><div><dt>来源</dt><dd>Arweave Mainnet</dd></div><div><dt>完整性</dt><dd id="success-integrity">已验证</dd></div></dl><button id="download-recovered">下载恢复文件</button><button id="download-again">再次下载</button></section><p><a href="../../web/recover.html" target="_blank">打开正式独立恢复页面</a></p></section>
<section class="card"><h2>4. Mainnet Evidence</h2><div id="evidence-ready" class="warning" hidden><strong>主网恢复凭证已生成，请保存</strong></div><button id="export">下载主网恢复凭证</button><details><summary>技术详情</summary><pre id="evidence"></pre></details></section><div id="status" role="status"></div>
<script type="module" src="./app.js"></script></main></body></html>
