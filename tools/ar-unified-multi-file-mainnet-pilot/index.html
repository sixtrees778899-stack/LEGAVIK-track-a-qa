<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CJAS Unified Multi-File Archive Pilot</title><link rel="stylesheet" href="./style.css"></head><body><main><h1>CJAS Unified Multi-File Archive Pilot</h1><p class="notice">分多次追加白名单文件，累计不超过50 MiB。全部文件将进入一个冻结Snapshot、一个加密Archive、一份Recovery Kit、一笔Mainnet交易和一份Mainnet Recovery Evidence。</p>
<section class="card"><h2>1. 追加文件</h2><input id="add-files" type="file" multiple><button id="add">添加到当前集合</button><p id="capacity"></p><table><thead><tr><th>文件名</th><th>类型</th><th>大小</th><th>操作</th></tr></thead><tbody id="files"></tbody></table></section>
<section class="card"><h2>2. 统一生成</h2><label>Recovery Password<input id="password" type="password" autocomplete="new-password"></label><label>再次输入<input id="confirmation" type="password" autocomplete="new-password"></label><label><input id="ack" type="checkbox"> 我理解CJAS无法找回密码，并确认全部文件不含敏感信息。</label><button id="create">生成统一Archive与Recovery Kit</button><div id="create-result" class="summary"></div></section>
<section class="card"><h2>3. 保存统一恢复材料</h2><button id="save-kit" disabled>保存 Recovery Kit</button><button id="save-backup" disabled>保存 Local Encrypted Backup</button><button id="save-evidence" disabled>保存 Mainnet Recovery Evidence</button></section>
<section class="card"><h2>4. Mainnet报价与唯一广播</h2><button id="quote" disabled>连接钱包并查看报价</button><div id="quote-result" class="summary"></div><button id="broadcast" disabled>请求一次签名并广播统一Archive</button><div id="broadcast-result" class="summary"></div></section>
<section class="card"><details><summary>技术详情</summary><pre id="technical"></pre></details></section><div id="status" role="status"></div><script type="module" src="./app.js?v=unified-pilot-v1"></script></main></body></html>
