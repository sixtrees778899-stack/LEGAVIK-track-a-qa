<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CJAS Unified Multi-File Recovery</title><link rel="stylesheet" href="./style.css"></head><body><main><h1>CJAS Unified Multi-File Mainnet独立恢复</h1><p class="notice">只需要一份Mainnet Recovery Evidence、一份Recovery Kit和Recovery Password。系统从一笔TxID下载统一Archive，并恢复其中全部文件。</p><section class="card"><label>Mainnet Recovery Evidence<input id="evidence" type="file" accept=".json,application/json"></label><label>Recovery Kit<input id="kit" type="file" accept=".cjas,application/octet-stream"></label><label>Recovery Password<input id="password" type="password" autocomplete="current-password"></label><button id="recover">恢复全部文件</button></section>
