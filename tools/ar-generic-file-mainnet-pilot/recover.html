<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CJAS Generic File Independent Recovery</title><link rel="stylesheet" href="./style.css"></head><body><main><h1>单文件 Mainnet 独立恢复</h1><p class="notice">仅使用同一次创建生成的 Mainnet Recovery Evidence、Recovery Kit 和 Recovery Password。不会使用原文件或 Local Encrypted Backup / 本地加密备份。</p><section class="card"><label>Mainnet Recovery Evidence（广播成功后生成的 JSON，不是 Local Encrypted Backup）<input id="evidence-file" type="file" accept=".json,application/json"></label><label>Recovery Kit（必须与 Mainnet Recovery Evidence 属于同一次创建）<input id="kit-file" type="file" accept=".cjas,application/octet-stream"></label><label>Recovery Password<input id="password" type="password" autocomplete="current-password"></label><button id="recover">从 Arweave Mainnet 恢复</button><ol id="stages"></ol></section><section id="success" class="card success" hidden><h2>恢复成功</h2><p id="result"></p><button id="download">下载恢复文件</button><button id="download-again">再次下载</button></section><section class="card"><details><summary>技术详情</summary><pre id="recovery-evidence"></pre></details></section><div id="status" role="status"></div><script type="module" src="./recover.js?v=materials-ux-v1"></script></main></body></html>
