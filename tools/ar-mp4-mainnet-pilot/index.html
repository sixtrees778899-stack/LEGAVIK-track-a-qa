<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CJAS MP4 Mainnet Pilot</title><link rel="stylesheet" href="./style.css"></head><body><main>
<h1>CJAS MP4 Mainnet Pilot</h1><p class="notice">文件只在本设备浏览器中加密。当前页面仅开放至 Mainnet 报价，不会请求签名或广播。</p>
<section class="card"><h2>1. 选择并加密 MP4</h2><label>选择 MP4（不超过 10 MB）<input id="mp4" type="file" accept=".mp4,video/mp4"></label><div id="file-summary" class="summary" hidden></div><video id="preview" controls></video><label>设置全新测试恢复密码<input id="password" type="password" autocomplete="new-password"></label><label>再次输入恢复密码<input id="confirmation" type="password" autocomplete="new-password"></label><label class="confirm"><input id="ack" type="checkbox"> 我理解 CJAS 无法找回恢复密码，并确认视频不含敏感信息。</label><button id="encrypt">浏览器本地加密</button><div id="encryption-result" class="success" hidden></div><button id="download-kit" disabled>下载 Recovery Kit</button><button id="download-archive" disabled>下载本地加密 Archive</button></section>
<section class="card"><h2>2. Arweave Mainnet 报价</h2><button id="quote" disabled>连接钱包并查看实时报价</button><div id="quote-result" class="summary" hidden></div><p class="stop">报价完成后必须停止，等待 CEO 单次广播授权。</p></section>
<section class="card"><details><summary>技术详情</summary><pre id="evidence"></pre></details></section><div id="status" role="status"></div>
<script type="module" src="./app.js"></script></main></body></html>
